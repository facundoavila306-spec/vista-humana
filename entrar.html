<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171531">
<link rel="manifest" href="manifest.json"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vista Humana</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(160deg,#171531,#0F0E22);color:#171531;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.logo{display:block;margin:0 auto;width:72px;height:72px;border-radius:18px}
h1{text-align:center;font-size:1.35rem}p{color:#4A4766;font-size:.92rem;line-height:1.45;text-align:center}
label{font-size:.75rem;font-weight:700;color:#4A4766;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;border:1.5px solid #E3E3EC;border-radius:12px;padding:13px;font:inherit;font-size:1rem;margin-top:4px}
button{border:0;background:#B8331A;color:#fff;font-weight:800;border-radius:12px;padding:14px;font-size:1rem;cursor:pointer;min-height:48px}
.av{background:#FFF4DA;color:#8A5B00;border-radius:12px;padding:10px 12px;font-size:.88rem;text-align:center}
.pie{font-size:.72rem;color:#8a879c;text-align:center}
</style></head><body>
<div class="card">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Vista Humana</h1>
  <div class="av" id="nf" style="display:none"></div>
  <p>Escribí el código de tu empresa. Si no lo sabés, pedíselo a RR.HH.</p>
  <label for="cod">Código de tu empresa<input id="cod" autocapitalize="none" autocomplete="organization" placeholder="Ej: ferre"></label>
  <button id="ir">Entrar</button>
  <p class="pie">© 2026 Facundo Manuel Avila</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), nf = q.get('nf');
  if (nf) { var n = document.getElementById('nf'); n.textContent = 'No encontramos la empresa "' + nf + '". Revisá el código.'; n.style.display = 'block'; document.getElementById('cod').value = nf; }
  var ir = function () {
    var c = String(document.getElementById('cod').value || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (c) location.href = 'index.html?c=' + encodeURIComponent(c);
  };
  document.getElementById('ir').onclick = ir;
  document.getElementById('cod').onkeydown = function (e) { if (e.key === 'Enter') ir(); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(function () { });
})();
</script>
</body></html>
