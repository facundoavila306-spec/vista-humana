 const desc=[...items.filter(x=>C[x.t].s<0).map(x=>linea(C[x.t].n,$(x.v),x.d,x.id)),...cuotas.map(o=>linea(C[o.x.t].n+` · cuota ${o.c.n}/${o.c.de}${o.c.ultima?' ★':''}`,$(o.c.monto),o.x.d))];
 const acr=items.filter(x=>C[x.t].s>0).map(x=>linea(C[x.t].n,$(x.v),x.d,x.id));
 const inf=items.filter(x=>!C[x.t].s).map(x=>linea(C[x.t].n+(x.sub?' · '+x.sub:''),x.t==='obs'?'':C[x.t].u==='h'?hm(x.v):C[x.t].u==='d'?x.v+' d':x.v,x.d,x.id));
 const n=neto(p);
 const dTot=items.filter(x=>C[x.t].s<0).reduce((a,x)=>a+x.v,0)+cuotas.reduce((a,o)=>a+o.c.monto,0);
 const hist=[5,4,3,2,1,0].map(i=>{const m=ym-i;const s=N.filter(x=>x.k===key&&x.ym===m&&C[x.t].s<0).reduce((a,x)=>a+x.v,0)+PR.filter(x=>x.k===key).map(x=>cuotaDe(x,m)).filter(Boolean).reduce((a,c)=>a+c.monto,0);return{m,s}});

 abrir(`<div class="hd"><div><h2>${esc(p.n)}</h2><div class="sub">Legajo ${p.l} · ${esc(p.a)} · ${CONV[p.c]} · ${MESES[ym%12]} ${Math.floor(ym/12)}</div></div><button class="x" onclick="cerrar()">${ic('x')}</button></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri" onclick="editor('${key}','adelanto')">${ic('plus')} Cargar novedad</button><button class="btn" onclick="editor('${key}','he50')">Horas extra</button><button class="btn" onclick="editor('${key}','prestamo')">Préstamo o mercadería</button><button class="btn" onclick="editor('${key}','lic')">Licencia</button><button class="btn" onclick="abrirReg('${key}')">Fichajes del mes</button></div>
 <div class="sec"><h4><span>A descontar</span><span style="color:var(--bad)">${dTot?$(dTot):'—'}</span></h4>${desc.join('')||'<div class="it"><small>Nada este mes</small></div>'}</div>

 <div class="sec"><h4><span>Licencias del año</span></h4>${Object.entries(licAnio).map(([s,d])=>`<div class="it"><div class="g">${s}</div><span class="m">${d} d</span></div>`).join('')||'<div class="it"><small>No tiene</small></div>'}</div>
 <div class="sec"><h4><span>Descuentos de los últimos 6 meses</span></h4><div class="bars">${hist.map(h=>`<div class="${h.m===ym?'cur':''}"><i style="height:${Math.max(3,h.s/mx*50)}px"></i>${MESES[h.m%12].slice(0,3)}</div>`).join('')}</div></div>`);

/* ===== CONCEPTOS CONFIGURABLES =====
   Cada concepto dice de dónde sale: sistema (lo calcula el programa), regla (se calcula solo con las fichadas),
   marca (se tilda por día en el fichaje) o manual (se carga en novedades). Se arma por empresa y convenio. */
Object.assign(C.v8,{o:'regla',c:'V8',r:{t:'min',h:1,dias:'todos'}});
Object.assign(C.v2,{o:'regla',c:'V2',r:{t:'min',h:600,dias:'todos'}});
Object.assign(C.noct,{o:'regla',c:'Noct.',r:{t:'franja',a:'21:00',b:'06:00',dias:'todos'}});
Object.assign(C.desarr,{o:'marca',c:'D',m:{v:1}});
['horas','he50','he100','he200','aus','viaje','feri','presen'].forEach(x=>C[x].o='sistema');

function cfgDe(e,c){const key=e+'|'+c;if(!CFG[key])CFG[key]={g:JSON.parse(JSON.stringify(COLS[c])),off:[]};return CFG[key]}
function colsDe(e,c){const f=cfgDe(e,c);return f.g.map(g=>[g[0],g[1],g[2].filter(x=>!f.off.includes(x))]).filter(g=>g[2].length)}
const flatDe=(e,c)=>colsDe(e,c).flatMap(g=>g[2]);
const DIASOP={todos:'Todos los días',habiles:'Solo días hábiles',finde:'Solo sábados y domingos',feriados:'Solo feriados',francos:'Solo francos trabajados'};
const UN={'$':'en pesos',h:'en horas',d:'en días',n:'en cantidad',auto:'automático',t:'texto'};
function aplicaDia(p,r,dias){if(!dias||dias==='todos')return true;const d=dt(r.f),w=d.getDay(),fer=!!FERIADOS[r.f],s=sched(p,d);
 if(dias==='feriados')return fer;if(dias==='francos')return !s&&!fer;if(dias==='finde')return w===0||w===6;if(dias==='habiles')return !fer&&w>=1&&w<=5;return true}
function reglaVal(R,trab,trm){if(!trab)return 0;
 if(R.t==='min')return trab>=R.h?1:0;
 if(R.t==='rango')return trab>=R.h&&trab<R.h2?1:0;
 if(R.t==='franja'){let a=tm(R.a),b=tm(R.b);if(b<=a)b+=1440;let s=0;trm.forEach(([x,y])=>{s+=ovl(x,y,a,b)+ovl(x,y,a-1440,b-1440)+ovl(x,y,a+1440,b+1440)});return Math.min(s,trab)}
 if(R.t==='exc')return Math.max(0,trab-R.h);return 0}
function valConcepto(p,r,id,z,trm){const c=C[id];
 if(c.o==='marca')return r.mk&&r.mk[id]?(c.m.v||1):0;
 if(c.o!=='regla'||!aplicaDia(p,r,c.r.dias))return 0;return reglaVal(c.r,z.trab,trm)}
function txtRegla(id){const c=C[id];if(c.o==='sistema')return 'Lo calcula el sistema con las fichadas';if(c.o==='manual')return 'Se carga a mano en novedades';

 const R=c.r,d=R.dias&&R.dias!=='todos'?' · '+DIASOP[R.dias].toLowerCase():'';
 return ({min:R.h<=1?'1 por cada día trabajado':`1 por día si trabaja al menos ${hm(R.h)} h`,rango:`1 por día si trabaja entre ${hm(R.h)} y ${hm(R.h2)} h`,franja:`Horas trabajadas entre las ${R.a} y las ${R.b}`,exc:`Horas que pasan de ${hm(R.h)} en el día`})[R.t]+d}
